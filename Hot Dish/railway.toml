[build]
builder = "NIXPACKS"

buildCommand = "composer install --no-dev --optimize-autoloader && npm install && npm run build && php artisan config:clear && php artisan cache:clear && php artisan route:clear && php artisan view:clear && php artisan config:cache && php artisan migrate --force && php artisan storage:link"

[start]
command = "php artisan serve --host=0.0.0.0 --port=$PORT"

